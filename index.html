<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回診前關懷 Dashboard V11</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--blue:#2563eb;--border:#e5e7eb;--dark:#0f172a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef6ff,#f8fbff)}.login-card,.app{background:var(--card);border-radius:24px;box-shadow:0 18px 50px rgba(15,23,42,.12)}.login-card{width:min(460px,100%);padding:32px}
input,select,textarea,button{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px 14px;font:inherit}button{border:0;background:var(--blue);color:white;font-weight:800;cursor:pointer}button.secondary{background:#eef2ff;color:#1e40af}button.light{background:#f3f4f6;color:#111827}
.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}.error{background:#fee2e2;color:#991b1b;border-radius:12px;padding:10px;display:none}
.app{width:min(1500px,calc(100% - 28px));margin:18px auto;overflow:hidden}header{background:var(--dark);color:white;padding:20px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}header h1{font-size:22px;margin:0}.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.header-actions select{width:180px}
.layout{display:grid;grid-template-columns:365px 1fr 430px;min-height:800px}.panel{padding:20px;border-right:1px solid var(--border);overflow:auto;max-height:calc(100vh - 92px)}.panel:last-child{border-right:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.stat{background:#f8fafc;border:1px solid var(--border);border-radius:18px;padding:14px}.stat b{font-size:26px;display:block}
.patient,.staff-card,.card{background:white;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}.patient,.staff-card{cursor:pointer}.active{outline:3px solid #bfdbfe;border-color:#2563eb}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pid{font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:8px 4px 0 0}.green{background:#dcfce7;color:#166534}.yellow{background:#fef9c3;color:#854d0e}.red{background:#fee2e2;color:#991b1b}.blue{background:#eff6ff;color:#1d4ed8}.gray{background:#e5e7eb;color:#374151}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.info{background:#f8fafc;border-radius:14px;padding:12px}.info small{display:block;color:var(--muted)}
.chief{background:#0f172a;color:white;border-radius:16px;padding:16px;line-height:1.8;white-space:pre-wrap}.message-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:18px;padding:16px;line-height:1.9;white-space:pre-wrap}.jubei{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:18px;padding:16px;white-space:pre-wrap}
.form-grid{display:grid;gap:12px}.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.saved{display:none;background:#ecfdf5;color:#166534;border-radius:12px;padding:10px}
.supervisor{padding:20px}.supervisor-grid{display:grid;grid-template-columns:360px 1fr;gap:20px}table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden;border:1px solid var(--border)}th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#f8fafc}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:#2563eb}
@media(max-width:1180px){.layout,.supervisor-grid{grid-template-columns:1fr}.panel{max-height:none;border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><h1>回診前關懷 Dashboard</h1><p class="muted">Demo版：Excel 名單內所有員工皆可登入，密碼 0000。</p><div style="display:grid;gap:12px"><select id="loginUser"></select><input id="loginPassword" value="0000" type="password"><button onclick="login()">登入測試版</button><div id="loginError" class="error">密碼錯誤，測試密碼皆為 0000。</div></div><div class="card muted">主管 / 0000 可看全部員工統計。<br>員工登入後只會看到自己的關懷名單。</div></div></section>
<main id="app" class="app hidden"><header><div><h1 id="pageTitle"></h1><div class="muted" style="color:#cbd5e1" id="subTitle"></div></div><div class="header-actions"><select id="weekSelect" onchange="changeWeek()"><option>0511</option><option>0518</option><option>0525</option></select><button class="secondary" style="width:auto" onclick="logout()">登出</button></div></header>
<section id="staffView" class="layout">
<aside class="panel"><div class="stats"><div class="stat"><small>本週指派</small><b id="statTotal"></b></div><div class="stat"><small>未完成</small><b id="statUnfinished"></b></div><div class="stat"><small>已完成</small><b id="statDone"></b></div><div class="stat"><small>已改約</small><b id="statChanged"></b></div></div><div class="form-grid"><input id="keyword" placeholder="搜尋姓名 / PID / 狀態 / 備註" oninput="renderList()"><select id="filter" onchange="renderList()"><option value="">全部狀態</option><option value="未完成">未完成</option><option>電話完成</option><option>會員由顧問關懷</option><option>line完成</option><option>待回覆</option><option>未連繫上</option><option>已改約回診時間</option><option>判斷不需關懷</option><option>已有同仁聯繫</option><option>需諮詢師關懷</option></select></div><h3>我的患者</h3><div id="list"></div></aside>
<section class="panel"><div id="detail"></div></section>
<aside class="panel">
<div class="card"><h3>狀態與備註編輯</h3><div class="form-grid"><select id="statusSelect" onchange="toggleStatusCustom()"><option value="">未完成</option><option>電話完成</option><option>會員由顧問關懷</option><option>line完成</option><option>待回覆</option><option>未連繫上</option><option>已改約回診時間</option><option>判斷不需關懷</option><option>已有同仁聯繫</option><option>需諮詢師關懷</option><option value="__custom__">其他：手動輸入</option></select><input id="statusCustom" class="hidden" placeholder="手動輸入狀態"><select id="noteSelect" onchange="toggleNoteCustom()"><option value="">無備註</option><option>指定line</option><option value="__custom__">其他：手動輸入</option></select><textarea id="noteCustom" class="hidden" placeholder="手動輸入備註"></textarea><button onclick="saveStatusNote()">儲存狀態與備註</button><div id="savedMsg" class="saved">已儲存。</div></div></div>
<div class="card"><h3>SeaX 通話區</h3><div class="quick-row"><button onclick="alert('Demo：正式版可開啟 SeaX 撥號')">☎ 開始撥號</button><button class="light" onclick="pasteExample()">貼範例逐字稿</button></div></div>
<div class="card"><h3>逐字稿 / 關懷內容</h3><textarea id="transcript" style="min-height:190px" placeholder="請貼上 SeaX 逐字稿或問答內容"></textarea><br><br><button onclick="aiSummarize()">AI 整理成固定格式主訴</button></div>
<div class="card"><h3>AI 整理結果</h3><div id="aiResult" class="muted">尚未整理。</div><br><div class="quick-row"><button class="secondary" onclick="saveCare()">儲存到居備 Demo</button><button class="light" onclick="copyAiResult()">複製整理結果</button></div></div>
</aside></section>
<section id="supervisorView" class="supervisor hidden"><div class="stats"><div class="stat"><small>全員本週指派</small><b id="supTotal"></b></div><div class="stat"><small>全員未完成</small><b id="supUnfinished"></b></div><div class="stat"><small>全員已完成</small><b id="supDone"></b></div><div class="stat"><small>完成率</small><b id="supRate"></b></div></div><div class="supervisor-grid"><aside><h3>員工完成狀況</h3><div id="staffSummary"></div></aside><section><h3 id="staffDetailTitle"></h3><table><thead><tr><th>負責同仁</th><th>患者</th><th>PID</th><th>地區</th><th>下次回診</th><th>狀態</th><th>備註</th></tr></thead><tbody id="supervisorTable"></tbody></table></section></div></section>
</main>

const users = ["主管", ...employees];
let currentUser="", role="staff", currentWeek="0511", patients=[], selected=0, generated="", supervisorSelectedStaff="全部";
const loginUser=document.getElementById("loginUser"); users.forEach(u=>loginUser.innerHTML += `<option>${u}</option>`);
function login(){const u=loginUser.value,pw=document.getElementById("loginPassword").value;if(pw!=="0000"){loginError.style.display="block";return}loginError.style.display="none";currentUser=u;role=u==="主管"?"supervisor":"staff";selected=0;document.getElementById("login").classList.add("hidden");app.classList.remove("hidden");renderMode()}
function logout(){app.classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function changeWeek(){currentWeek=weekSelect.value;selected=0;supervisorSelectedStaff="全部";renderMode()}
function weekRows(){return allPatients.filter(p=>p.week===currentWeek)} function userRows(){return weekRows().filter(p=>p.owner===currentUser)}
function displayStatus(p){return p.status||"未完成"} function isUnfinished(p){return !p.status||["待回覆","未連繫上","需諮詢師關懷"].includes(p.status)} function isDone(p){return !isUnfinished(p)}
function tagClass(s){if(s==="未完成"||s==="未連繫上"||s==="需諮詢師關懷")return"red";if(s.includes("電話完成")||s.includes("line完成"))return"green";if(s.includes("待"))return"yellow";if(s.includes("改約"))return"blue";return"gray"}
function renderMode(){if(role==="supervisor"){pageTitle.textContent="主管｜全員回診前關懷進度";subTitle.textContent="可依 0511 / 0518 / 0525 查看每位員工待關懷名單";staffView.classList.add("hidden");supervisorView.classList.remove("hidden");renderSupervisor()}else{patients=userRows();pageTitle.textContent=currentUser+"｜回診前關懷名單";subTitle.textContent="員工登入後只顯示自己的患者";staffView.classList.remove("hidden");supervisorView.classList.add("hidden");renderAll()}}
function renderAll(){renderStats();renderList();renderDetail();loadEditFields()}
function renderStats(){statTotal.textContent=patients.length;statUnfinished.textContent=patients.filter(isUnfinished).length;statDone.textContent=patients.filter(isDone).length;statChanged.textContent=patients.filter(p=>p.status==="已改約回診時間").length}
function filtered(){const k=keyword.value.trim(),f=filter.value;return patients.map((p,i)=>Object.assign({},p,{i})).filter(p=>{const s=displayStatus(p);return (!k||(p.name+p.pid+s+p.note+p.area).includes(k)) && (!f||(f==="未完成"?isUnfinished(p):p.status===f))})}
function renderList(){const rows=filtered();list.innerHTML=rows.map(p=>`<div class="patient ${p.i===selected?'active':''}" onclick="selectPatient(${p.i})"><div class="row"><b>${p.name}</b><span class="pid">PID ${p.pid}</span></div><div class="muted">${p.area}｜下次回診 ${p.next}</div><span class="tag ${tagClass(displayStatus(p))}">${displayStatus(p)}</span>${p.note?`<span class="tag blue">備註：${p.note}</span>`:""}</div>`).join("")||'<p class="muted">此週沒有指派患者。</p>'}
function selectPatient(i){selected=i;generated="";transcript.value="";aiResult.innerHTML="尚未整理。";renderAll()}
function renderDetail(){if(!patients.length){detail.innerHTML='<div class="card">這週沒有指派患者。</div>';return}const p=patients[selected];detail.innerHTML=`<div class="card"><div class="row"><div><h2>${p.name}</h2><div class="muted">PID ${p.pid}｜${p.area}｜健管：${currentUser}</div></div><span class="tag ${tagClass(displayStatus(p))}">${displayStatus(p)}</span></div>${p.note?`<span class="tag blue">備註：${p.note}</span>`:""}</div><div class="card"><h3>Excel 指派資訊 Demo</h3><div class="info-grid"><div class="info"><small>下次回診</small><b>${p.next}</b></div><div class="info"><small>目前狀態</small><b>${displayStatus(p)}</b></div><div class="info"><small>負責同仁</small><b>${p.owner}</b></div><div class="info"><small>地區</small><b>${p.area}</b></div></div></div><div class="card"><h3>HIS 上次回診主訴 Demo</h3><div class="chief">${p.hisChief}</div></div><div class="card"><h3>依上次主訴產出回診前關懷內容</h3><div class="message-box" id="careMessageBox">尚未產生。</div><br><div class="quick-row"><button class="secondary" onclick="generateCareMessage()">用 GPT 產生訊息 Demo</button><button class="light" onclick="copyCareMessage()">複製訊息</button></div></div><div class="card"><h3>居備 Demo</h3><div class="jubei">${p.jubei}</div></div>`}
function renderSupervisor(){const rows=weekRows(),total=rows.length,un=rows.filter(isUnfinished).length,done=rows.filter(isDone).length;supTotal.textContent=total;supUnfinished.textContent=un;supDone.textContent=done;supRate.textContent=total?Math.round(done/total*100)+"%":"0%";staffSummary.innerHTML=`<div class="staff-card ${supervisorSelectedStaff==='全部'?'active':''}" onclick="selectSupervisorStaff('全部')"><div class="row"><b>全部員工</b><span class="pid">${rows.length} 位患者</span></div></div>`+employees.map(name=>{const r=rows.filter(p=>p.owner===name),d=r.filter(isDone).length,u=r.filter(isUnfinished).length,rate=r.length?Math.round(d/r.length*100):0;return `<div class="staff-card ${supervisorSelectedStaff===name?'active':''}" onclick="selectSupervisorStaff('${name}')"><div class="row"><b>${name}</b><span class="pid">${r.length} 位</span></div><span class="tag green">完成 ${d}</span><span class="tag red">未完成 ${u}</span><div class="progress"><span style="width:${rate}%"></span></div><div class="muted">完成率 ${rate}%</div></div>`}).join("");const t=supervisorSelectedStaff==="全部"?rows:rows.filter(p=>p.owner===supervisorSelectedStaff);staffDetailTitle.textContent=supervisorSelectedStaff==="全部"?"全員患者明細":supervisorSelectedStaff+"｜患者明細";supervisorTable.innerHTML=t.map(p=>`<tr><td>${p.owner}</td><td>${p.name}</td><td>${p.pid}</td><td>${p.area}</td><td>${p.next}</td><td><span class="tag ${tagClass(displayStatus(p))}">${displayStatus(p)}</span></td><td>${p.note||""}</td></tr>`).join("")||`<tr><td colspan="7">此週沒有資料。</td></tr>`}
function selectSupervisorStaff(n){supervisorSelectedStaff=n;renderSupervisor()}
function loadEditFields(){if(!patients.length)return;const p=patients[selected];statusSelect.value=p.status||"";noteSelect.value=p.note==="指定line"?"指定line":(p.note?"__custom__":"");noteCustom.value=p.note==="指定line"?"":p.note;toggleNoteCustom();toggleStatusCustom()}
function toggleStatusCustom(){statusCustom.classList.toggle("hidden",statusSelect.value!=="__custom__")} function toggleNoteCustom(){noteCustom.classList.toggle("hidden",noteSelect.value!=="__custom__")}
function saveStatusNote(){const p=patients[selected];p.status=statusSelect.value==="__custom__"?(statusCustom.value.trim()||"其他"):statusSelect.value;p.note=noteSelect.value==="__custom__"?noteCustom.value.trim():noteSelect.value;renderAll();savedMsg.style.display="block";setTimeout(()=>savedMsg.style.display="none",1200)}
function generateCareMessage(){const p=patients[selected];careMessageBox.textContent=`${p.name}您好 😊\n\n這裡是診所健康管理團隊，想在您 ${p.next} 回診前，先了解最近的身體狀況，提供醫師參考：\n\n1️⃣ 上次主訴追蹤\n上次回診提到的不適，目前有改善、持平或變嚴重嗎？\n\n2️⃣ 睡眠與精神\n近期睡眠、精神與白天體力是否有明顯變化呢？\n\n3️⃣ 整體狀況\n這次回診是否有特別想請醫師協助確認的問題呢？\n\n若有其他新的不適或變化，也歡迎一起告訴我們，我們會協助紀錄提供醫師參考 🙏\n\n祝您今日順心愉快~ 🌷`;}
function copyCareMessage(){navigator.clipboard&&navigator.clipboard.writeText(careMessageBox.textContent).then(()=>alert("已複製訊息。"))}
function pasteExample(){transcript.value=`1️⃣ 睡眠狀況\n最近是否仍有入睡困難的情況呢？ 是\n大約需要多久時間才能入睡？吃安眠藥半小時會\n夜間睡眠品質如何呢？兩次 12:00、3:00\n22:00會上床睡覺\n13:30-14:30\n\n2️⃣ 情緒狀況\n是否有特別容易緊張或擔心的情況？ 相對穩定\n\n3️⃣ 久坐不適\n目前久坐相關的不舒服症狀是否仍持續呢？ 持續右側背痛，因為早起不會，活動後中午會痛 傍晚最痛`;}
function aiSummarize(){const raw=transcript.value.trim();if(!raw){generated="未貼上逐字稿，無法整理。";aiResult.innerHTML=`<div class="chief">${generated}</div>`;return}generated="1. 睡眠：仍有入睡困難情形，需服用安眠藥後約30分鐘才能入睡；約晚上22:00上床睡覺，夜間約於00:00及03:00醒來2次；白天約13:30–14:30會午休。\n2. 情緒：情緒狀況相對穩定，無明顯緊張或擔憂加劇情形。\n3. 背部疼痛：久坐相關不適持續存在，以右側背痛為主；早上起床時較不明顯，活動後於中午開始出現疼痛，傍晚時疼痛最為明顯。";aiResult.innerHTML=`<div class="chief">${generated}</div>`}
function copyAiResult(){if(!generated)return alert("尚未產生整理結果。");navigator.clipboard&&navigator.clipboard.writeText(generated).then(()=>alert("已複製整理結果。"))}
function saveCare(){if(!generated)return alert("請先整理。");patients[selected].jubei=generated;renderAll();alert("已儲存到居備 Demo。")}
